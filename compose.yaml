services:
  postgres:
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=sentinel_db'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=user'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5433:5432'
  mongodb:
    image: 'mongo:latest'
    ports:
      - '27017:27017'
    labels:
      - "org.springframework.boot.service-connection=mongo"
